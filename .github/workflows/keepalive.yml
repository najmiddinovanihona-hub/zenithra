# Render bepul tarifida server 15 daqiqa so'rovsiz qolsa "uxlab qoladi" va keyingi ochilish ~50 s kechikadi.
# Har 10 daqiqada /api/health ga so'rov yuborib, serverni uyg'oq ushlab turamiz (Render: oyiga 750 bepul soat — 24/7 ga yetadi).
name: Keep Render awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /api/health
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 https://zenithra.onrender.com/api/health) || code=000
            echo "urinish $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "::warning::Sayt javob bermadi (oxirgi kod: $code)"
